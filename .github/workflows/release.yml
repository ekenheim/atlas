name: release

# Pushing a tag vX.Y.Z publishes ghcr.io/ekenheim/atlas:X.Y.Z (plus a
# sha-<commit> tag) after the same CI gates as every other run. See
# docs/deployment.md for the release process.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ekenheim/atlas

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The CI entrypoint gates the release; the image is built (once) below.
      - run: scripts/ci.sh --no-image

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
          # The action also derives org.opencontainers.image.version (from
          # the tag, without the v) and .revision (the commit SHA); source
          # is pinned here so the GHCR package links to this repo.
          labels: |
            org.opencontainers.image.source=https://github.com/ekenheim/atlas
      # Build into the local daemon first and smoke it (non-root, read-only
      # root, writable /tmp) before anything is pushed. amd64 only: the
      # cluster has no other architecture.
      - name: Build (local, for smoke)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: atlas:release
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ATLAS_CODE_VERSION=${{ github.sha }}
            ATLAS_VERSION=${{ steps.meta.outputs.version }}
      - name: Smoke the image
        run: scripts/image-smoke.sh atlas:release
        env:
          # atlas_build_info must report the tag's version (vX.Y.Z -> X.Y.Z).
          ATLAS_SMOKE_EXPECT_VERSION: ${{ steps.meta.outputs.version }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same inputs as the smoke build, so every layer comes from the cache.
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ATLAS_CODE_VERSION=${{ github.sha }}
            ATLAS_VERSION=${{ steps.meta.outputs.version }}
