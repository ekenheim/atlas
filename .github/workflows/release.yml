name: release

# Pushing a tag vX.Y.Z publishes ghcr.io/ekenheim/atlas:X.Y.Z (plus a
# sha-<commit> tag) after the same CI gates as every other run: when the tagged commit
# already has a successful `ci` run (it normally has: the release is cut from a green
# integration branch), that run is the gate and the suite is not run again; otherwise it
# runs here. See docs/deployment.md for the release process.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ekenheim/atlas

jobs:
  verified:
    # Whether ci.yml already passed on this exact commit (any branch). Fails closed: an API
    # error fails this job, and then nothing is published.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      green: ${{ steps.check.outputs.green }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success&per_page=1" --jq '.total_count')
          echo "successful ci runs of ${{ github.sha }}: $runs"
          if [ "$runs" -gt 0 ]; then echo "green=true" >> "$GITHUB_OUTPUT"; else echo "green=false" >> "$GITHUB_OUTPUT"; fi

  ci:
    needs: verified
    if: needs.verified.outputs.green != 'true'
    # The same self-hosted scale set as ci.yml: on GitHub's hosted runners the suite
    # outgrew the 30-minute limit (v0.2.2's release was cancelled at 30 minutes with the
    # tests passed and the e2e still to run).
    runs-on: gha-runner-scale-set-atlas
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.7.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The runner image has the Docker CLI (dind) but not the compose plugin.
      - name: Docker compose plugin
        run: |
          if ! docker compose version >/dev/null 2>&1; then
            mkdir -p "$HOME/.docker/cli-plugins"
            curl -fsSL -o "$HOME/.docker/cli-plugins/docker-compose" \
              "https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-x86_64"
            chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          fi
          docker compose version
      # The CI entrypoint gates the release; the image is built (once) below.
      - run: scripts/ci.sh --no-image

  publish:
    needs: [verified, ci]
    # The gate: a green ci run of this commit already existed, or the suite passed here.
    if: >-
      always() && needs.verified.result == 'success' &&
      (needs.verified.outputs.green == 'true' || needs.ci.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # The signed build provenance (attest-build-provenance): an OIDC token, and the
      # attestation stored with the repo.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
          # The action also derives org.opencontainers.image.version (from
          # the tag, without the v) and .revision (the commit SHA); source
          # is pinned here so the GHCR package links to this repo.
          labels: |
            org.opencontainers.image.source=https://github.com/ekenheim/atlas
      # Build into the local daemon first and smoke it (non-root, read-only
      # root, writable /tmp) before anything is pushed. amd64 only: the
      # cluster has no other architecture.
      - name: Build (local, for smoke)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: atlas:release
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ATLAS_CODE_VERSION=${{ github.sha }}
            ATLAS_VERSION=${{ steps.meta.outputs.version }}
      - name: Smoke the image
        run: scripts/image-smoke.sh atlas:release
        env:
          # atlas_build_info must report the tag's version (vX.Y.Z -> X.Y.Z).
          ATLAS_SMOKE_EXPECT_VERSION: ${{ steps.meta.outputs.version }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same inputs as the smoke build, so every layer comes from the cache. The pushed
      # image also carries an SBOM and BuildKit's provenance.
      - name: Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ATLAS_CODE_VERSION=${{ github.sha }}
            ATLAS_VERSION=${{ steps.meta.outputs.version }}
      # A signed statement (Sigstore, GitHub's attestation store) that this digest was built
      # by this workflow from this commit: `gh attestation verify oci://ghcr.io/ekenheim/atlas:X.Y.Z -R ekenheim/atlas`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
