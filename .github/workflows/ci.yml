name: ci

# Push only (every branch): the jobs run on the owner's self-hosted runners, so fork pull
# requests must never trigger them (this repo is public).
on:
  push:
    branches: ["**"]

# One run per branch; a newer push to a work branch supersedes its running CI (main runs all).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    # The owner's actions-runner-controller scale set (home-ops, dind mode: Docker for the
    # compose services and the image build).
    runs-on: gha-runner-scale-set-atlas
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Same entrypoint as local runs, so CI and laptops can't drift.
      - run: scripts/ci.sh
