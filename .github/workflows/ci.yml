name: ci

# Push only (every branch): the suite runs on the owner's self-hosted runners, so fork pull
# requests must never trigger it (this repo is public). Renovate's branches live in this
# repo, so their pushes run here too.
on:
  push:
    branches: ["**"]

permissions:
  contents: read

# One run per branch; a newer push to a work branch supersedes its running CI (main runs all).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions are pinned by commit; Renovate keeps the pins and their version comments current.
jobs:
  # Every push gets a `ci` result, because main's ruleset requires one. A push that only changes
  # the local issue tracker or the implementation log skips the checks: no test reads them,
  # except the pilot plan (tests/unit/test_memory_probes.py). A new branch's first push, or a
  # compare the API can't give, counts as code. release.yml asks for a `suite` that ran.
  # A commit whose `suite` already passed (on its integrate/ branch, before main was
  # fast-forwarded to the same commit) is not tested again: check runs belong to the commit,
  # so main's ruleset and release.yml see that green `suite`.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          code=true
          # Already tested: a successful `suite` check run on this very commit.
          passed=$(gh api "repos/${{ github.repository }}/commits/$AFTER/check-runs?check_name=suite&status=completed"             --jq '[.check_runs[] | select(.conclusion == "success")] | length' || echo 0)
          if [ "${passed:-0}" -gt 0 ]; then
            echo "suite already passed on $AFTER; not testing it again"
            echo "code=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            # The compare API lists at most 300 files; a longer list counts as code.
            if files=$(gh api "repos/${{ github.repository }}/compare/$BEFORE...$AFTER" --jq '.files[].filename') \
              && [ -n "$files" ] && [ "$(echo "$files" | wc -l)" -lt 300 ]; then
              other=$(echo "$files" | grep -v -e '^\.scratch/' -e '^docs/implementation-log\.md$' || true)
              pilot=$(echo "$files" | grep -x '\.scratch/pilot/pilot-plan\.md' || true)
              [ -z "$other" ] && [ -z "$pilot" ] && code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # No Docker needed: GitHub's runners (free for a public repo), so a lint or type error
    # fails in minutes and never takes a self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The workflows themselves (.github/actionlint.yaml names the self-hosted label).
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - run: scripts/ci.sh static

  suite:
    needs: [changes, static]
    if: needs.changes.outputs.code == 'true'
    # The owner's actions-runner-controller scale set (home-ops, dind mode: Docker for the
    # compose services and the image build). At most 3 runners, 4 CPUs each; jobs beyond
    # that wait in GitHub's queue, where this timeout does not run.
    runs-on: gha-runner-scale-set-atlas
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Chromium for the e2e tests, keyed on the lock file (it pins Playwright's version).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      # The runner image has the Docker CLI (dind) but not the compose plugin.
      - name: Docker compose plugin
        run: |
          if ! docker compose version >/dev/null 2>&1; then
            mkdir -p "$HOME/.docker/cli-plugins"
            curl -fsSL -o "$HOME/.docker/cli-plugins/docker-compose" \
              "https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-x86_64"
            chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          fi
          docker compose version
      # Same entrypoint as local runs, so CI and laptops can't drift.
      - run: scripts/ci.sh suite

  # The one check main's ruleset requires: green when every stage passed, or when the push
  # changed no code and the stages were skipped for that reason.
  ci:
    if: always()
    needs: [changes, static, suite]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "changes: ${{ needs.changes.result }} (code: ${{ needs.changes.outputs.code }}), static: ${{ needs.static.result }}, suite: ${{ needs.suite.result }}"
          [ "${{ needs.changes.result }}" = success ] || exit 1
          if [ "${{ needs.changes.outputs.code }}" = false ]; then exit 0; fi
          [ "${{ needs.static.result }}" = success ] && [ "${{ needs.suite.result }}" = success ]
