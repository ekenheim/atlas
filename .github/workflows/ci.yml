name: ci

# Push only (every branch): the jobs run on the owner's self-hosted runners, so fork pull
# requests must never trigger them (this repo is public).
on:
  push:
    branches: ["**"]
    # A push that only changes the local issue tracker or the implementation log runs nothing:
    # no test reads them, except the pilot plan (tests/unit/test_memory_probes.py). A release
    # of such a commit still runs the suite (release.yml: no green ci run for its commit).
    paths:
      - "**"
      - "!.scratch/**"
      - ".scratch/pilot/pilot-plan.md"
      - "!docs/implementation-log.md"

# One run per branch; a newer push to a work branch supersedes its running CI (main runs all).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    # The owner's actions-runner-controller scale set (home-ops, dind mode: Docker for the
    # compose services and the image build).
    runs-on: gha-runner-scale-set-atlas
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The runner image has the Docker CLI (dind) but not the compose plugin.
      - name: Docker compose plugin
        run: |
          if ! docker compose version >/dev/null 2>&1; then
            mkdir -p "$HOME/.docker/cli-plugins"
            curl -fsSL -o "$HOME/.docker/cli-plugins/docker-compose" \
              "https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-x86_64"
            chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          fi
          docker compose version
      # Same entrypoint as local runs, so CI and laptops can't drift.
      - run: scripts/ci.sh
