themes:
  photonics:
    title: Photonics for AI data centers
    description: >-
      Optical transceivers, lasers and components whose capacity may constrain AI
      data-center build-outs, across the supply chain from substrate to system.
      The research hunts the bottleneck: trace demand to hardware, components,
      sub-components and feedstock or process equipment (InP and GaAs substrates,
      indium, gallium, germanium, MOCVD tools), and ask who chokes each layer
      (single or sole sources, capacity, lead times, qualification, export controls)
      and what would relieve it (second sources, substitutes, new capacity).
    companies:
      - axt
      - soitec
      - iqe
      - coherent
      - lumentum
      - macom
      - stmicroelectronics
      - marvell
      - innolight
      - applied-optoelectronics
      - fabrinet
      - ciena

  # The second theme (atlas-beliefs ticket 20): the SEC-path seeds of the memory and packaging
  # seed list. Its layers are its own, upstream to downstream as the seed list orders them;
  # a company's layer must be one of them. `package-substrate` is not photonics' `substrate`.
  memory-packaging:
    title: Memory and advanced packaging for AI
    description: >-
      High-bandwidth memory, NAND and the advanced packaging that joins them to AI
      accelerators. The research traces AI demand to HBM and NAND, to the bonders, test and
      inspection tools, OSATs, package substrates and materials that make them, and asks who
      chokes each layer (single or sole sources, capacity, lead times, qualification, export
      controls) and what would relieve it (second sources, new capacity, other packaging).
    layers:
      - name: memory-dram
        covers: DRAM and HBM (3D-stacked DRAM) makers
      - name: memory-nand
        covers: NAND flash makers and the joint ventures that supply their wafers
      - name: controller
        covers: memory and SSD controllers (fabless)
      - name: bond-equipment
        covers: thermo-compression and hybrid bonders that stack HBM dies
      - name: process-control
        covers: inspection and metrology for wafers, stacks and packages
      - name: test
        covers: probe cards and memory test systems
      - name: osat
        covers: outsourced assembly and test, including CoWoS-class advanced packaging
      - name: package-substrate
        covers: IC and ABF package substrates
      - name: package-materials
        covers: build-up films, resins and other packaging materials
    companies:
      - micron
      - sk-hynix
      - sandisk
      - camtek
      - formfactor
      - ase-technology
      - amkor

  # The early-call scorecard's theme (atlas-beliefs ticket 29a; docs/decisions.md, "Isolated
  # sessions for the scorecard"). Never a scheduled agent's theme: the runs are the lead's, each
  # one an isolated session as of a past date. Its own short layer list is the smallest change
  # to the per-theme layers that lets SanDisk (memory-nand) sit beside four companies with no
  # layer; `memory-nand` is the same layer name as memory-packaging's, so no migration.
  scorecard:
    title: Early-call scorecard
    description: >-
      The companies of the early-call scorecard's answer key: does Atlas, reading only what
      was public on a past date, name a bottleneck before the market priced it, and stay quiet
      where there was none. SanDisk (NAND), IREN (grid power), eToro, Snap and POET (the
      negatives). Replayed in isolated sessions only.
    layers:
      - name: memory-nand
        covers: NAND flash makers (SanDisk, the one scored company with a layer)
    companies:
      - sandisk
      - iren
      - etoro
      - snap
      - poet-technologies
