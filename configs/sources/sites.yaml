# The site register: every site an exchange or issuer adapter may request, with its terms
# decision (docs/source-licenses.md §5; atlas.sources.gate). A request to a host listed
# nowhere here is blocked. Per site:
# - `hosts`: the host names it serves from (lowercase)
# - `terms_url`, `terms_checked_on`: the terms read, and when
# - `automation`: what the terms say about automated access: `allowed`; `forbidden` (only a
#   recorded `consent` from the site's owner lifts it); or `unchecked` (not yet read: blocked)
# - `terms_note`: the relevant clause, briefly
# - `consent`: {reference, granted_on, scope}, once the owner has permission in writing
# - `rate_per_s`: the request budget for the site (default 1/s)
# - `api_client`: {url_prefixes, documentation_url, note}, for a site that documents an API
#   for programs: URLs under those prefixes are requests of an API client, not a crawler, so
#   robots.txt is read and recorded but doesn't block them (only for `automation: allowed`)
# - `own_site_of`: the slugs of the companies whose own site this is (their investor-relations
#   or press pages). A page of it fetched for one of them with `atlas sources fetch` is Tier A
#   (`public_issuer`); for any other company it is Tier B. Empty: a third party's site.
# - `license_class`: the licence class of a Tier B page of the site (default `third_party`)
# robots.txt is never recorded here: the gate reads it before the first request of each
# ingest to a site, and obeys it (RFC 9309), apart from an `api_client`'s prefixes.
#
# To onboard a site for `atlas sources fetch` (a company's own pages, decks and slides):
# 1. read its terms of use and robots.txt; 2. add an entry below with its `hosts` (every host
# the pages and their files are served from), `terms_url`, the date you read them,
# `automation` (`allowed` only if the terms permit automated access to the pages Atlas wants;
# `forbidden` if they don't, with a `block_reason`; else `unchecked`) and the clause in
# `terms_note`; 3. for a company's own site add `own_site_of: [<slug>]`; 4. bump `version`.
# Until then the site is blocked: `sources fetch` records a `blocked` gate decision and
# requests nothing. docs/source-licenses.md §5 is the human-readable record; keep it in step.
#
# Bump `version` on any change.
version: 8

sites:
  hkexnews:
    publisher: HKEXnews (Hong Kong Exchanges and Clearing Limited)
    hosts: [www1.hkexnews.hk, www.hkexnews.hk, www2.hkexnews.hk]
    terms_url: https://www.hkex.com.hk/Global/Exchange/Terms-of-Use?sc_lang=en
    terms_checked_on: 2026-09-29  # the terms were updated 19 Aug 2025
    automation: forbidden
    terms_note: >-
      The HKEX Terms of Use (covering hkexnews.hk) forbid "any text or data mining or web
      scraping" and "any 'robot', 'bot', 'spider', 'scraper' or other automated device ... to
      access, obtain, copy, monitor or republish any portion of the Website", and compiling
      databases by systematic retrieval. The official automated route is HKEX's licensed
      Issuer Information feed Service (IIS); HKEX's prior written consent (info@hkex.com.hk)
      also lifts a restriction. Neither is held, so Atlas makes no request to HKEXnews;
      documents fetched by hand come in through `atlas sources import`.
    block_reason: >-
      blocked: HKEX Terms of Use prohibit automated access (IIS licence or written consent
      required)
    rate_per_s: 1

  zj-innolight:
    publisher: Zhongji Innolight Co., Ltd. (issuer site)
    hosts: [ir.zj-innolight.com, www.zj-innolight.com]
    automation: unchecked
    terms_note: >-
      Terms not checked. Its robots.txt disallows everything on ir.zj-innolight.com and
      /uploads/ (the IR PDFs) on www.zj-innolight.com (seed-list research, 2026-09-29).
      Innolight's filings come from HKEXnews instead; this entry only makes the block explicit.

  fca-nsm:
    publisher: FCA National Storage Mechanism (Financial Conduct Authority)
    # The search API (a POST of a JSON query) and the documents it links (/artefacts/NSM/...).
    hosts: [api.data.fca.org.uk, data.fca.org.uk]
    terms_url: https://data.fca.org.uk/artefacts/NSM_Terms_of_Use.pdf
    terms_checked_on: 2026-09-29  # Terms of Use updated 19 March 2020; AUP 18 February 2020
    automation: allowed
    terms_note: >-
      The NSM Terms of Use: "You may use the material and documents contained in the NSM for
      any lawful purpose not otherwise excluded by these terms and conditions or the
      Acceptable Use Policy" (and "You may not ... use the FCA's name, logo or any other
      identifying mark for any purpose"); uploaders grant "other users of this site a limited
      licence to use, store and copy that content and to distribute and make it available to
      third parties including for any lawful commercial purpose". The Acceptable Use Policy
      (https://data.fca.org.uk/artefacts/NSM_General_AUP.pdf) adds: "Not to reproduce,
      duplicate, copy or re-sell any part of our site in contravention of the provisions of
      our terms of website use" and "Not to access without authority, interfere with, damage
      or disrupt any part of our site". Conditions Atlas keeps: a low, fixed request rate
      (rate_per_s), no republishing of the site, no use of the FCA's name or marks. No
      robots.txt is served (403 on both hosts, 2026-09-29), which RFC 9309 reads as no
      restrictions; the gate still reads it on every ingest. The user guide (v10.0, June
      2026) also offers CSV export of search results with a download link per line.
    rate_per_s: 0.5

  lse-rns:
    publisher: London Stock Exchange (RNS regulatory news)
    hosts: [www.londonstockexchange.com, londonstockexchange.com, api.londonstockexchange.com]
    terms_url: https://www.londonstockexchange.com/disclaimer
    terms_checked_on: 2026-09-29
    automation: forbidden
    terms_note: >-
      Its robots.txt disallows /en-gb/ (where the RNS news pages live) for every user agent.
      The disclaimer provides RNS announcements "to the general public for personal use and
      to RNS customers in a professional capacity"; users may "store such pages in electronic
      form on disk (but not on any server or other storage device connected to a network)
      for personal use", and the information "may not be copied, reproduced, republished,
      downloaded, posted, broadcast or transmitted in any other way to any third parties for
      commercial gain". IQE's regulated announcements come from the FCA NSM instead.
    block_reason: >-
      blocked: LSE disclaimer limits RNS to personal use stored off any network, and
      robots.txt disallows /en-gb/ (an RNS data licence or written consent required)
    rate_per_s: 1

  iqe-brighter-ir:
    publisher: IQE plc regulatory-news iframe (Brighter IR)
    hosts: [polaris.brighterir.com]
    automation: unchecked
    terms_note: >-
      Terms not checked. The regulatory-news iframe on IQE's investor site is served from
      polaris.brighterir.com, whose robots.txt is "User-agent: *" / "Disallow: /" (checked
      2026-09-29). IQE's announcements come from the FCA NSM instead; this entry only makes
      the block explicit.

  amf-info-financiere:
    publisher: AMF info-financière (Autorité des marchés financiers; run by the DILA)
    # The Explore API and the files its records link to (`url_de_recuperation`), which are
    # served from Opendatasoft's file host.
    hosts: [www.info-financiere.gouv.fr, fr.ftp.opendatasoft.com]
    terms_url: https://www.data.gouv.fr/dataservices/api-info-financiere
    terms_checked_on: 2026-09-29
    automation: allowed
    terms_note: >-
      The data.gouv.fr dataservice "API info-financière" (producer: Premier ministre / DILA)
      gives the licence "Licence Ouverte / Open Licence 2.0" (Etalab), the base URL
      https://www.info-financiere.gouv.fr/api/explore/v2.0 and the limit "10000 appels API
      par ip par jour" (10,000 API calls per IP per day); the API answered with
      "X-RateLimit-Limit: 5000" on 2026-09-29. The licence allows reuse, including
      commercial, provided the source and the date of its last update are credited: each
      stored announcement carries that credit (`attribution`). The DILA adds that reusers
      remain bound by the Loi Informatique et Libertés. Conditions Atlas keeps: the
      documented API only (never the site's HTML pages, RSS or Atom feeds, which robots.txt
      also disallows), at most 10 API calls per discovery, a fixed low rate (rate_per_s),
      and the credit on every document.
    rate_per_s: 0.5
    api_client:
      url_prefixes:
        - https://www.info-financiere.gouv.fr/api/explore/v2.0/catalog/datasets/flux-amf-new-prod/
        - https://fr.ftp.opendatasoft.com/datadila/INFOFI/
      documentation_url: https://www.data.gouv.fr/dataservices/api-info-financiere
      note: >-
        www.info-financiere.gouv.fr's robots.txt has "User-agent: *" with "Disallow: /api/"
        (and allows /api/ to Googlebot), and fr.ftp.opendatasoft.com's is "User-agent: *" /
        "Disallow: /" (both read 2026-09-29). They address crawlers; the API is published on
        data.gouv.fr for programs, with a per-IP quota, and its records give the file URLs.
        Atlas requests only the regulated-information dataset's records and the files they
        link to (lead's decision, ticket 06; docs/decisions.md).

  euronext:
    publisher: Euronext (euronext.com, company news and regulated announcements)
    hosts: [www.euronext.com, euronext.com, live.euronext.com, connect.euronext.com]
    terms_url: https://www.euronext.com/en/terms-use
    terms_checked_on: 2026-09-29  # last updated 29 April 2021
    automation: forbidden
    terms_note: >-
      The Euronext Terms of Use: "Except if we give you prior written permission, use of any
      Web browsers (other than generally available third-party browsers), engines,
      software, spiders, robots, avatars, agents, tools or other devices or mechanisms to
      navigate, search or determine the Euronext Website is strictly prohibited", and users
      "will not ... copy, reproduce, download ... compile or create derivative works from
      any Content or materials (including, without limitation, through framing or
      systematic retrieval to create collections, compilations, databases or directories)".
      The block rests on those terms: www.euronext.com's robots.txt (read 2026-09-29)
      disallows only site internals (/node/, /search/, /admin/ and the like) for "*".
      Soitec's regulated information comes from the AMF info-financière API instead.
    block_reason: >-
      blocked: Euronext Terms of Use prohibit robots and systematic retrieval (Euronext's
      prior written permission required)
    rate_per_s: 1

  soitec:
    publisher: Soitec SA (issuer site)
    hosts: [www.soitec.com, soitec.com]
    terms_url: https://www.soitec.com/home/terms-of-use
    terms_checked_on: 2026-09-29
    automation: forbidden
    terms_note: >-
      Soitec's terms of use: "In no event may you use, distribute, copy, reproduce, modify,
      distort, or transmit the Web site or any of its elements, such as text, images or
      sounds without the prior written permission of Soitec." Soitec's regulated
      information comes from the AMF info-financière API instead.
    block_reason: >-
      blocked: soitec.com's terms forbid reuse of the site's elements (Soitec's prior
      written permission required)
    rate_per_s: 1

  sec-edgar:
    publisher: U.S. Securities and Exchange Commission (EDGAR)
    # `fetch_page` of an EDGAR Archives URL (W9); the SEC ingest's own requests are not gated.
    # Asked with the SEC client: ATLAS_SEC_USER_AGENT and the shared SEC rate limit.
    hosts: [www.sec.gov, sec.gov]
    terms_url: https://www.sec.gov/search-filings/edgar-search-assistance/accessing-edgar-data
    terms_checked_on: 2026-10-19  # the page was last reviewed or updated 26 June 2024
    automation: allowed
    terms_note: >-
      SEC's fair-access policy: "Current max request rate: 10 requests/second"; automated
      clients must declare a User-Agent naming the company and an admin contact email;
      efficient scripts are acceptable, download only what is needed, and "The SEC does not
      allow botnets or automated tools to crawl the site" (see also
      https://www.sec.gov/privacy#security). Atlas fetches single documents it was asked
      for, never crawls. robots.txt (read 2026-10-19) has "Allow: /Archives/edgar/data" and
      disallows /cgi-bin, /search/ and the like.
    rate_per_s: 10
    license_class: public_regulatory

  # --- Ticket W9b (2026-10-19): the sites two research runs needed. Rule used for `automation`:
  # `allowed` only where the site states permission for programs (a documented API), an open
  # licence or a public-domain status, and nothing in its terms or robots.txt says otherwise;
  # `forbidden` where the terms bar robots, scraping, copying or commercial collection;
  # `unchecked` where the terms were read (or could not be) and neither permit nor forbid
  # automation, or are limited to personal or non-commercial use: blocked until the lead decides.

  federal-register:
    publisher: Federal Register (Office of the Federal Register, NARA, with the GPO)
    # The documented REST API, and the public-inspection PDFs its records link to. The PDFs of
    # published issues are on www.govinfo.gov (entry `govinfo`).
    hosts: [www.federalregister.gov, public-inspection.federalregister.gov]
    terms_url: https://www.federalregister.gov/reader-aids/developer-resources/rest-api
    terms_checked_on: 2026-10-19
    automation: allowed
    terms_note: >-
      No terms-of-use page was found. The developer page documents a REST API "so that others
      can access and take advantage of this data": "No API keys are needed; all you need is
      an HTTP client or browser", JSON or CSV, paginated, only the first 2000 results of a
      query reachable. The site's own block page (https://unblock.federalregister.gov/, which
      a request flagged as automated is redirected to) says: "Due to aggressive automated
      scraping of FederalRegister.gov and eCFR.gov, programmatic access to these sites is
      limited to access to our extensive developer APIs." So the API is the one automated
      route; Atlas uses it (and the PDF links in its records) and never crawls the site's HTML
      pages, which the gate cannot itself prevent. Federal Register content is a work of the
      US Government (public domain; not restated on these pages). robots.txt (2026-10-19) on
      www.federalregister.gov disallows only /documents/current, /documents/email-a-friend,
      the search pages, /my/ and /auth/; public-inspection.federalregister.gov serves no
      robots.txt (403, an S3 AccessDenied), which RFC 9309 reads as no restrictions.
      No numeric rate limit is published; the rate below is Atlas's own.
    rate_per_s: 0.5
    license_class: public_regulatory
    api_client:
      url_prefixes:
        - https://www.federalregister.gov/api/v1/
        - https://public-inspection.federalregister.gov/
      documentation_url: https://www.federalregister.gov/reader-aids/developer-resources/rest-api
      note: >-
        The API is published for programs; robots.txt addresses crawlers and disallows
        none of /api/v1/. Atlas requests the API's records and the public-inspection files
        they link to, one document at a time.

  govinfo:
    publisher: GovInfo (U.S. Government Publishing Office)
    # The PDFs and XML of the Federal Register's published issues
    # (https://www.govinfo.gov/content/pkg/FR-.../pdf/...).
    hosts: [www.govinfo.gov]
    terms_url: https://www.govinfo.gov/about/policies/public-domain-copyright-notice
    terms_checked_on: 2026-10-19
    automation: allowed
    terms_note: >-
      GovInfo's Public Domain & Copyright Notice: copyright "is not available for any work of
      the United States Government", the intent being "to place in the public domain all work
      of the United States Government" (publications of third parties on the site keep their
      owners' rights). The policies pages set no limit on automated access (they name only a
      permission for the LOCKSS program to crawl), and the site publishes sitemaps and a
      developer hub for programs. robots.txt (2026-10-19): disallows only the Drupal internals
      and /app/search/*. Conditions Atlas keeps: single documents at a low fixed rate, no
      use of the search pages.
    rate_per_s: 1
    license_class: public_regulatory

  whitehouse:
    publisher: The White House (Executive Office of the President)
    hosts: [www.whitehouse.gov]
    terms_url: https://www.whitehouse.gov/copyright/
    terms_checked_on: 2026-10-19
    automation: allowed
    terms_note: >-
      Copyright Policy: "Pursuant to federal law, government-produced materials appearing on
      this site are not copyright protected" (the Government may hold copyrights transferred
      to it; third-party content is "licensed under a Creative Commons Attribution 3.0
      License" unless noted). The page says nothing about automated access, and no terms of
      use were found; robots.txt (2026-10-19) is "User-agent: *" with only "Disallow: /*?s="
      and "Disallow: /*&s=" (search result pages). Allowed on the strength of the
      public-domain status and the permissive robots.txt, not an express permission for
      programs. Conditions Atlas keeps: single pages at a low fixed rate, never the search
      pages.
    rate_per_s: 1
    license_class: public_regulatory

  mofcom:
    publisher: Ministry of Commerce of the People's Republic of China (MOFCOM)
    hosts: [www.mofcom.gov.cn, xkzj.mofcom.gov.cn]
    automation: unchecked
    terms_note: >-
      Terms not found for these hosts. The www.mofcom.gov.cn home page carries no readable
      site statement (the footer is script-rendered), and its guessed statement paths 404.
      Statements found on MOFCOM's other sub-sites (exportcontrol.mofcom.gov.cn and
      tradeinservices.mofcom.gov.cn, via search snippets only, not read here) say original
      articles are MOFCOM's copyright and a reproduction must credit MOFCOM; they do not
      address automated access and are not this site's terms. robots.txt: www.mofcom.gov.cn
      returns 404 (2026-10-19); xkzj.mofcom.gov.cn did not connect (2026-10-19, from a
      residential Windows host), so its terms and robots.txt could not be read at all.
      Blocked until read. Documents needed from it (announcements, export-control
      licensing notices) can be imported by hand with `atlas sources import`.

  asx-announcements:
    publisher: ASX (ASX Limited; company announcements platform)
    hosts: [announcements.asx.com.au, www.asx.com.au, asx.com.au]
    terms_url: https://www.asx.com.au/legals/terms-of-use
    terms_checked_on: 2026-10-19  # Terms of Use "Last updated 25 May 2026"
    automation: forbidden
    terms_note: >-
      The ASX Terms of Use bar users from using "any spider, screen scraper, robot, other
      similar software or device, or other similar process, to use or access the Site in any
      way whatsoever, including monitoring, downloading or copying any content on the Site
      (except as otherwise permitted under these terms or with ASX's prior written consent)"
      and from using "any manual process to monitor or copy any content on the Site"
      without consent. Market announcements are on the Site (the announcements page says
      their access and use is subject to these terms), and no clause permits automated
      announcement feeds. robots.txt: www.asx.com.au disallows /search* and one data page;
      announcements.asx.com.au serves no robots.txt (a 404 page; 2026-10-19). The listed
      company's own site, or a licensed ASX data feed, are the routes; documents fetched by
      hand come in through `atlas sources import`.
    block_reason: >-
      blocked: ASX Terms of Use prohibit spiders, screen scrapers, robots and manual
      copying of the Site (ASX's prior written consent required)
    rate_per_s: 1

  jpx-timely-disclosure:
    publisher: Japan Exchange Group (JPX; timely disclosure, TDnet)
    # The terms are those of www.jpx.co.jp; www2.jpx.co.jp serves the TDnet disclosure files.
    hosts: [www2.jpx.co.jp, www.jpx.co.jp]
    terms_url: https://www.jpx.co.jp/english/term-of-use/
    terms_checked_on: 2026-10-19
    automation: forbidden
    terms_note: >-
      The JPX website's Terms of Use: "The collection of data or secondary use of information
      from this website for commercial purposes is strictly prohibited, unless JPX has granted
      prior permission or authorized such use under a paid contract", "No part of this
      website may be modified or adapted without prior permission from JPX", and, under
      Others: "Please refrain from automatic information retrieval and other operations which
      may lead to high-load and/or high frequency access." The last is a request, not a bar,
      and whether Atlas's use is "commercial" is the lead's to judge; the block is the
      conservative reading. JPX Market Innovation & Research sells the timely-disclosure data
      (a TDnet API under its own contract). The terms were read on www.jpx.co.jp and are
      taken to cover www2.jpx.co.jp, the same operator's file host (not confirmed). robots.txt
      on www2.jpx.co.jp: 404 (2026-10-19). Documents fetched by hand come in through
      `atlas sources import`.
    block_reason: >-
      blocked: JPX terms prohibit commercial collection of the site's data without permission
      or a paid contract and ask users to refrain from automatic retrieval (JPX's permission
      or the paid TDnet API required)
    rate_per_s: 1

  nse-india:
    publisher: National Stock Exchange of India (NSE; corporate announcement archives)
    hosts: [nsearchives.nseindia.com, www.nseindia.com]
    terms_url: https://www.nseindia.com/static/nse-terms-of-use
    terms_checked_on: 2026-10-19  # "Updated on: 29/10/2025"
    automation: forbidden
    terms_note: >-
      The nseindia.com Terms of Use: "User is prohibited to conduct any systematic or
      automated data collection activities (including scraping, data mining, data extraction
      and data harvesting) on or in relation to our Website / Mobile Application." The
      archives host serves the documents the Website links to and is taken to be covered
      (not stated in the terms). robots.txt on nsearchives.nseindia.com returned an HTML
      error page rather than a robots file (2026-10-19). Documents fetched by hand come in
      through `atlas sources import`.
    block_reason: >-
      blocked: NSE Terms of Use prohibit systematic or automated data collection, including
      scraping (NSE's written consent required)
    rate_per_s: 1

  ge-vernova:
    publisher: GE Vernova Inc. (issuer site)
    hosts: [www.gevernova.com, gevernova.com]
    terms_url: https://www.gevernova.com/terms
    terms_checked_on: 2026-10-19  # "Last Updated July 16, 2024"
    automation: allowed
    terms_note: >-
      Owner override (2026-10-19; docs/decisions.md, "Owner override: sites that permit personal, non-commercial use"): the terms grant personal, non-commercial use and are silent on automated access; Atlas is the owner's private, non-commercial research tool, so it fetches single documents here, rate-limited, obeying robots.txt. The terms read: Terms read; they neither permit nor forbid automated access. "You may access, copy,
      download and print the material contained on the site for your personal and
      non-commercial use, provided you do not modify or delete any copyright, trademark or
      other proprietary notice", while "the modification, distribution, transmission,
      performance, broadcast, publication, uploading, licensing, reverse engineering,
      transfer or sale of, or the creation of derivative works from, any material ... or use
      of the site for purposes competitive to GE Vernova, is expressly prohibited". No robot
      or scraping clause. robots.txt (2026-10-19) is the Drupal default plus /media/oembed
      and software PDFs under /software/.

  howmet:
    publisher: Howmet Aerospace Inc. (issuer site)
    hosts: [www.howmet.com]
    terms_url: https://www.howmet.com/legal-notices/
    terms_checked_on: 2026-10-19
    automation: allowed
    terms_note: >-
      Owner override (2026-10-19; docs/decisions.md, "Owner override: sites that permit personal, non-commercial use"): the terms grant personal, non-commercial use and are silent on automated access; Atlas is the owner's private, non-commercial research tool, so it fetches single documents here, rate-limited, obeying robots.txt. The terms read: Legal Notices read; no clause on automated access. "Unless otherwise indicated, you may
      download material displayed on this website for noncommercial, personal use only,
      provided you also retain all copyright and other proprietary notices", and "You may not,
