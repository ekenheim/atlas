# The site register: every site an exchange or issuer adapter may request, with its terms
# decision (docs/source-licenses.md §5; atlas.sources.gate). A request to a host listed
# nowhere here is blocked. Per site:
# - `hosts`: the host names it serves from (lowercase)
# - `terms_url`, `terms_checked_on`: the terms read, and when
# - `automation`: what the terms say about automated access: `allowed`; `forbidden` (only a
#   recorded `consent` from the site's owner lifts it); or `unchecked` (not yet read: blocked)
# - `terms_note`: the relevant clause, briefly
# - `consent`: {reference, granted_on, scope}, once the owner has permission in writing
# - `rate_per_s`: the request budget for the site (default 1/s)
# - `api_client`: {url_prefixes, documentation_url, note}, for a site that documents an API
#   for programs: URLs under those prefixes are requests of an API client, not a crawler, so
#   robots.txt is read and recorded but doesn't block them (only for `automation: allowed`)
# robots.txt is never recorded here: the gate reads it before the first request of each
# ingest to a site, and obeys it (RFC 9309), apart from an `api_client`'s prefixes.
#
# Bump `version` on any change.
version: 3

sites:
  hkexnews:
    publisher: HKEXnews (Hong Kong Exchanges and Clearing Limited)
    hosts: [www1.hkexnews.hk, www.hkexnews.hk, www2.hkexnews.hk]
    terms_url: https://www.hkex.com.hk/Global/Exchange/Terms-of-Use?sc_lang=en
    terms_checked_on: 2026-09-29  # the terms were updated 19 Aug 2025
    automation: forbidden
    terms_note: >-
      The HKEX Terms of Use (covering hkexnews.hk) forbid "any text or data mining or web
      scraping" and "any 'robot', 'bot', 'spider', 'scraper' or other automated device ... to
      access, obtain, copy, monitor or republish any portion of the Website", and compiling
      databases by systematic retrieval. The official automated route is HKEX's licensed
      Issuer Information feed Service (IIS); HKEX's prior written consent (info@hkex.com.hk)
      also lifts a restriction. Neither is held, so Atlas makes no request to HKEXnews;
      documents fetched by hand come in through `atlas sources import`.
    block_reason: >-
      blocked: HKEX Terms of Use prohibit automated access (IIS licence or written consent
      required)
    rate_per_s: 1

  zj-innolight:
    publisher: Zhongji Innolight Co., Ltd. (issuer site)
    hosts: [ir.zj-innolight.com, www.zj-innolight.com]
    automation: unchecked
    terms_note: >-
      Terms not checked. Its robots.txt disallows everything on ir.zj-innolight.com and
      /uploads/ (the IR PDFs) on www.zj-innolight.com (seed-list research, 2026-09-29).
      Innolight's filings come from HKEXnews instead; this entry only makes the block explicit.

  fca-nsm:
    publisher: FCA National Storage Mechanism (Financial Conduct Authority)
    # The search API (a POST of a JSON query) and the documents it links (/artefacts/NSM/...).
    hosts: [api.data.fca.org.uk, data.fca.org.uk]
    terms_url: https://data.fca.org.uk/artefacts/NSM_Terms_of_Use.pdf
    terms_checked_on: 2026-09-29  # Terms of Use updated 19 March 2020; AUP 18 February 2020
    automation: allowed
    terms_note: >-
      The NSM Terms of Use: "You may use the material and documents contained in the NSM for
      any lawful purpose not otherwise excluded by these terms and conditions or the
      Acceptable Use Policy" (and "You may not ... use the FCA's name, logo or any other
      identifying mark for any purpose"); uploaders grant "other users of this site a limited
      licence to use, store and copy that content and to distribute and make it available to
      third parties including for any lawful commercial purpose". The Acceptable Use Policy
      (https://data.fca.org.uk/artefacts/NSM_General_AUP.pdf) adds: "Not to reproduce,
      duplicate, copy or re-sell any part of our site in contravention of the provisions of
      our terms of website use" and "Not to access without authority, interfere with, damage
      or disrupt any part of our site". Conditions Atlas keeps: a low, fixed request rate
      (rate_per_s), no republishing of the site, no use of the FCA's name or marks. No
      robots.txt is served (403 on both hosts, 2026-09-29), which RFC 9309 reads as no
      restrictions; the gate still reads it on every ingest. The user guide (v10.0, June
      2026) also offers CSV export of search results with a download link per line.
    rate_per_s: 0.5

  lse-rns:
    publisher: London Stock Exchange (RNS regulatory news)
    hosts: [www.londonstockexchange.com, londonstockexchange.com, api.londonstockexchange.com]
    terms_url: https://www.londonstockexchange.com/disclaimer
    terms_checked_on: 2026-09-29
    automation: forbidden
    terms_note: >-
      Its robots.txt disallows /en-gb/ (where the RNS news pages live) for every user agent.
      The disclaimer provides RNS announcements "to the general public for personal use and
      to RNS customers in a professional capacity"; users may "store such pages in electronic
      form on disk (but not on any server or other storage device connected to a network)
      for personal use", and the information "may not be copied, reproduced, republished,
      downloaded, posted, broadcast or transmitted in any other way to any third parties for
      commercial gain". IQE's regulated announcements come from the FCA NSM instead.
    block_reason: >-
      blocked: LSE disclaimer limits RNS to personal use stored off any network, and
      robots.txt disallows /en-gb/ (an RNS data licence or written consent required)
    rate_per_s: 1

  iqe-brighter-ir:
    publisher: IQE plc regulatory-news iframe (Brighter IR)
    hosts: [polaris.brighterir.com]
    automation: unchecked
    terms_note: >-
      Terms not checked. The regulatory-news iframe on IQE's investor site is served from
      polaris.brighterir.com, whose robots.txt is "User-agent: *" / "Disallow: /" (checked
      2026-09-29). IQE's announcements come from the FCA NSM instead; this entry only makes
      the block explicit.

  amf-info-financiere:
    publisher: AMF info-financière (Autorité des marchés financiers; run by the DILA)
    # The Explore API and the files its records link to (`url_de_recuperation`), which are
    # served from Opendatasoft's file host.
    hosts: [www.info-financiere.gouv.fr, fr.ftp.opendatasoft.com]
    terms_url: https://www.data.gouv.fr/dataservices/api-info-financiere
    terms_checked_on: 2026-09-29
    automation: allowed
    terms_note: >-
      The data.gouv.fr dataservice "API info-financière" (producer: Premier ministre / DILA)
      gives the licence "Licence Ouverte / Open Licence 2.0" (Etalab), the base URL
      https://www.info-financiere.gouv.fr/api/explore/v2.0 and the limit "10000 appels API
      par ip par jour" (10,000 API calls per IP per day); the API answered with
      "X-RateLimit-Limit: 5000" on 2026-09-29. The licence allows reuse, including
      commercial, provided the source and the date of its last update are credited: each
      stored announcement carries that credit (`attribution`). The DILA adds that reusers
      remain bound by the Loi Informatique et Libertés. Conditions Atlas keeps: the
      documented API only (never the site's HTML pages, RSS or Atom feeds, which robots.txt
      also disallows), at most 10 API calls per discovery, a fixed low rate (rate_per_s),
      and the credit on every document.
    rate_per_s: 0.5
    api_client:
      url_prefixes:
        - https://www.info-financiere.gouv.fr/api/explore/v2.0/catalog/datasets/flux-amf-new-prod/
        - https://fr.ftp.opendatasoft.com/datadila/INFOFI/
      documentation_url: https://www.data.gouv.fr/dataservices/api-info-financiere
      note: >-
        www.info-financiere.gouv.fr's robots.txt has "User-agent: *" with "Disallow: /api/"
        (and allows /api/ to Googlebot), and fr.ftp.opendatasoft.com's is "User-agent: *" /
        "Disallow: /" (both read 2026-09-29). They address crawlers; the API is published on
        data.gouv.fr for programs, with a per-IP quota, and its records give the file URLs.
        Atlas requests only the regulated-information dataset's records and the files they
        link to (lead's decision, ticket 06; docs/decisions.md).

  euronext:
    publisher: Euronext (euronext.com, company news and regulated announcements)
    hosts: [www.euronext.com, euronext.com, live.euronext.com, connect.euronext.com]
    terms_url: https://www.euronext.com/en/terms-use
    terms_checked_on: 2026-09-29  # last updated 29 April 2021
    automation: forbidden
    terms_note: >-
      The Euronext Terms of Use: "Except if we give you prior written permission, use of any
      Web browsers (other than generally available third-party browsers), engines,
      software, spiders, robots, avatars, agents, tools or other devices or mechanisms to
      navigate, search or determine the Euronext Website is strictly prohibited", and users
      "will not ... copy, reproduce, download ... compile or create derivative works from
      any Content or materials (including, without limitation, through framing or
      systematic retrieval to create collections, compilations, databases or directories)".
      The block rests on those terms: www.euronext.com's robots.txt (read 2026-09-29)
      disallows only site internals (/node/, /search/, /admin/ and the like) for "*".
      Soitec's regulated information comes from the AMF info-financière API instead.
    block_reason: >-
      blocked: Euronext Terms of Use prohibit robots and systematic retrieval (Euronext's
      prior written permission required)
    rate_per_s: 1

  soitec:
    publisher: Soitec SA (issuer site)
    hosts: [www.soitec.com, soitec.com]
    terms_url: https://www.soitec.com/home/terms-of-use
    terms_checked_on: 2026-09-29
    automation: forbidden
    terms_note: >-
      Soitec's terms of use: "In no event may you use, distribute, copy, reproduce, modify,
      distort, or transmit the Web site or any of its elements, such as text, images or
      sounds without the prior written permission of Soitec." Soitec's regulated
      information comes from the AMF info-financière API instead.
    block_reason: >-
      blocked: soitec.com's terms forbid reuse of the site's elements (Soitec's prior
      written permission required)
    rate_per_s: 1
