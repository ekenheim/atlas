  mp-materials:
    publisher: MP Materials Corp. (issuer site)
    hosts: [mpmaterials.com]
    terms_url: https://mpmaterials.com/legal
    terms_checked_on: 2026-10-19
    automation: forbidden
    terms_note: >-
      Web Site Terms of Use: "You agree not to reverse engineer any aspect of the Web Site or
