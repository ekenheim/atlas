# Lead ranking (atlas.discovery.ranking): how an investigation chooses which of a
# discovery's leads to keep. Each lead is scored for relevance to the query that found it
# and that query's purpose; the top-scoring leads, down to `min_score`, are kept, up to the
# lead budget. A lead stays Tier C metadata whatever its score: it is never Evidence.
#
# - `min_score`: leads scoring below it are never kept (0 to 100).
# - `denied_hosts`: never kept (dictionaries and translation sites: a company name that is
#   also an English word, "coherent", finds its definition). A host matches an entry when
#   it is the entry or a subdomain of it.
# - `demoted_hosts`: kept only on merit, their score times `demoted_host_factor`
#   (encyclopedias, broker and quote pages, company profile and social sites: rarely where
#   a bottleneck is reported). An entry with a path (`bloomberg.com/profile`) demotes only
#   the pages under it.
# - `company_site_factor`: a universe company's own site (its `website` in the theme config,
#   subdomains included, plus `company_domains`) has its score multiplied by it: its
#   homepage, "About us" and investor pages are on topic but tell a researcher nothing an
#   industry article or its filings don't.
# - `company_domains`: other domains of universe companies than their `website`.
# - `generic_titles`: a result whose title has a part (split at `|`, ` - `, `:` and the like)
#   that is one of these page names has its score multiplied by `generic_title_factor`.
# - `non_english_factor`: a result that doesn't read as English has its score multiplied by
#   it (searches ask SearXNG for English; an engine may still answer in another language).
# - `terms`: the product and layer vocabulary of the research themes (layers, products,
#   materials); each one a result names adds to its score. Lowercase; a term of several
#   words matches as a phrase. A one-word filing phrase is searched in EDGAR only when it is
#   one of these (atlas.discovery.edgar_fts).
# - `method_terms`: the bottleneck method's vocabulary ("capacity", "supply"); scored like
#   `terms`, but no product or layer: a one-word filing phrase that is one is not searched.
# - `bare_term_factor`: an EDGAR filing hit whose search matched one phrase that is itself a
#   term of `terms` or `method_terms` ("VCSEL", "CW laser", "export controls") has its score
#   multiplied by it: lidar and medical-laser makers write those too.
#
# Whatever it scores, a result naming none of its query's topic terms (the query less the
# company names in it, and years) is not kept: a company name alone never keeps a lead.
#
# Bump `version` on any change: an investigation's leads record the version that ranked them.
# Version 2 (pilot fix 08): company names count less than the query's topic, company sites,
# profile and social sites and generic titles are demoted (`docs/decisions.md`).
# Version 3 (memory-directed reading, ticket 04): an EDGAR filing hit is scored against its
# query and purpose (version 2: against the phrase EDGAR matched, so every hit was kept), a
# hit of a bare vocabulary term is demoted, and the bottleneck method's vocabulary is its
# own list. A web result scores as in version 2.
version: 3
min_score: 15
demoted_host_factor: 0.25
company_site_factor: 0.25
generic_title_factor: 0.25
non_english_factor: 0.25
bare_term_factor: 0.25

denied_hosts:
  - merriam-webster.com
  - dictionary.cambridge.org
  - dictionary.com
  - collinsdictionary.com
  - thefreedictionary.com
  - oxfordlearnersdictionaries.com
  - vocabulary.com
  - wordreference.com
  - wiktionary.org
  - urbandictionary.com
  - bab.la
  - linguee.com
  - linguee.se
  - reverso.net
  - synonyms.com
  - thesaurus.com

demoted_hosts:
  # encyclopedias
  - wikipedia.org
  - britannica.com
  - investopedia.com
  # broker, quote and screener pages
  - avanza.se
  - nordnet.se
  - nordnet.com
  - finance.yahoo.com
  - google.com
  - investing.com
  - marketscreener.com
  - stockanalysis.com
  - macrotrends.net
  - companiesmarketcap.com
  - tradingview.com
  - robinhood.com
  - morningstar.com
  - zacks.com
  # company profile and social sites
  - linkedin.com
  - crunchbase.com
  - zoominfo.com
  - bloomberg.com/profile
  - pitchbook.com/profiles
  - glassdoor.com
  - x.com
  - twitter.com
  - facebook.com
  - instagram.com
  - youtube.com
  # encyclopedia mirrors
  - wikiwand.com

# Universe companies' domains beside their theme-config `website`.
company_domains:
  - ii-vi.com # Coherent's name until 2022

# Page names that say nothing of the topic ("About Us | Coherent", "Lumentum - Investor
# Relations"). Matched against a whole part of the title, case-insensitively.
generic_titles:
  - about
  - about us
  - company
  - company overview
  - overview
  - home
  - homepage
  - investor relations
  - investors
  - careers
  - jobs
  - contact
  - contact us
  - products

terms:
  # layers
  - substrate
  - wafer
  - epitaxy
  - epi
  - mocvd
  - laser
  - chip
  - dsp
  - transceiver
  - optical module
  - contract manufacturing
  - photonics
  - silicon photonics
  - optics
  # products and materials
  - eml
  - electro-absorption
  - vcsel
  - cw laser
  - dfb
  - indium phosphide
  - inp
  - gallium arsenide
  - gaas
  - germanium
  - gallium
  - indium
  - soi
  - co-packaged optics
  - cpo
  - 400g
  - 800g
  - 1.6t
  - 200g

# The bottleneck method's vocabulary: what is asked about a product, not a product.
method_terms:
  - capacity
  - supply
  - shortage
  - lead time
  - qualification
  - second source
  - allocation
  - supplier
  - customer
  - export controls
