# Known answers (memory-quality ticket 14): the Source Version sections that hold an answer to
# each pilot question, so the conformance check can measure whether Memory points at them
# (`scripts/memory-conformance.sh`; `docs/runbooks.md`, "Memory conformance"; read-only on the
# live bank, no LLM call).
#
# Questions are the probe set's (`configs/memory/probes.yaml`, by ID); each is recalled with its
# Scout-style queries, as an investigation's pointer recalls are.
#
# Each answer names its company, its document (url; else accession, with `exhibit` for an
# exhibit; else form and filed date, and the sentence picks the document), its section anchor
# and its sentence, verbatim (typography and whitespace are folded when it is looked for). It is
# labelled with the hop of the supply chain it is about (demand, system, module, chip,
# substrate, feedstock, equipment) and the part of the bottleneck test it serves
# (demand_vs_capacity, second_source, pricing_power, bom_share, financing_dilution): the
# Serenity method's bottleneck test (M1), multi-hop mapping (M2), layer fluency (M3), share of
# BOM (M4), financing and dilution (M6). `basis` says where it comes from: the pilot review
# quotes the fact (review_quote), the review names it missing and the sentence is the
# archive's (review_gap), or the question asks for it and no review covers it (question).
#
# Anchors: given where the sentence was found in the recorded EDGAR fixtures of the same
# document (`tests/fixtures/edgar/`, parsed and sectioned by Atlas's own parser and sectioner).
# `section: null` means the review named the document but the fixtures don't hold it (or hold
# it truncated): the anchor is to be filled from the first live run, whose report lists the
# section each such sentence was found in. Nothing here was invented.
#
# No answer serves bom_share: no review quotes a share-of-BOM statement, and none was found in
# the recorded filings. The report shows that row empty, on purpose.
#
# Bump `version` on any change and say so in the implementation log.
version: 2

thresholds:
  # First settings, before any live run (2026-10-02). The lead revisits them after the first
  # live run, which is the before-measure.
  recall_at_10: 0.25
  recall_at_50: 0.5

answers:
