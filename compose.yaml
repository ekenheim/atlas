# Local development and CI stack. `docker compose up -d postgres-app silo`
# brings up the backing services; the api/worker services run the app image.
name: atlas

services:
  postgres-app:
    image: postgres:17
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-app:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 3s
      retries: 20

  # MinIO no longer publishes images (see docs/decisions.md); PGSTY Silo is a
  # maintained MinIO fork with versioning and object lock, pinned by digest.
  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: atlas-dev
      MINIO_ROOT_PASSWORD: atlas-dev-secret
    ports:
      - "127.0.0.1:59000:9000"
    volumes:
      - silo:/data

  # The app image, as three roles. Readiness (/health/ready) is the truth about
  # whether the flow works; Compose ordering only sequences startup.
  migrate:
    build: .
    command: ["migrate"]
    environment: &app-env
      ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas@postgres-app:5432/atlas
      ATLAS_ACTOR: ${ATLAS_ACTOR:-local-researcher}
      ATLAS_ARCHIVE_ROOT: /data/archive
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres-app:
        condition: service_healthy

  api:
    build: .
    command: ["api"]
    environment: *app-env
    read_only: true
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:${ATLAS_API_PORT:-58080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 3s
      retries: 20
    volumes:
      - archive:/data/archive
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    # Until the job queue lands (ticket 04) the worker only checks in and exits.
    command: ["worker", "--once"]
    environment: *app-env
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - archive:/data/archive
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-app:
  silo:
  archive:
