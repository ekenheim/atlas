themes:
  robotics-test:
    title: Robot joints (test theme)
    description: A theme that is not photonics, with layers of its own.
    layers:
      - name: actuators
        covers: linear and rotary actuators for robot joints
      - name: reducers
        covers: harmonic and planetary reducers
      - name: motors
        covers: frameless torque motors
      - name: sensors
        covers: encoders and force-torque sensors (no company yet)
    companies:
      - acme-actuators
      - gearbox-works
      - volt-motors
      - integrator-one
