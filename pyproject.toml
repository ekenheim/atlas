[project]
name = "atlas-research"
version = "0.1.0"
description = "Evidence-driven investment research platform built around Hindsight."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "boto3>=1.43.104",
    "fastapi>=0.115",
    "httpx2>=2.13.1",
    "prometheus-client>=0.20",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-json-logger>=2.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
atlas = "atlas.cli:main"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.104",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-socket>=0.7",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/atlas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.pyright]
include = ["backend", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the Compose services (real Postgres); network limited to localhost",
    "live: calls real external services; never run in CI",
]
addopts = "-ra --strict-markers -m 'not live' --disable-socket --allow-unix-socket"
